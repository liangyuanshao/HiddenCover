[package]
name = "hiddencover"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Research prototype for stateless anonymous-credential revocation"

[dependencies]
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = { version = "0.4", features = ["derive"] }
ark-std = "0.4"
bbs_plus = "0.25"
blake2 = "0.10"
csv = "1.3"
dock_crypto_utils = "0.23"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
